#:schema https://mise.jdx.dev/schema/mise.json

[tools]

"github:crate-ci/committed" = "latest"
# Upstream only publishes binaries for these OS/architecture combinations.
"github:mazznoer/lolcrab" = { version = "latest", os = [
  "linux/x64",
  "macos/arm64",
  "windows/x64",
] }
aube = "latest"
betterleaks = "1.9.0"
bun = "latest"
dprint = "latest"
hk = "latest"
jactionlint = { version = "latest", workflow = "release.yaml" }
lua-language-server = "3"
node = "26"
"github:nubjs/nub" = "latest"
ripgrep = "latest"
shellcheck = "0.11"
shfmt = "latest"
stylua = "2"
taplo = "latest"
task = "latest"
typos = "latest"
uv = "latest"
yamllint = "1.38"

[hooks]
postinstall = "hk install --mise"

[env]
HK_HIDE_WHEN_DONE = "1"

[settings]
experimental = true
# using a lockfile helps avoid the need for a GitHub token on first time install
# activate with `mise lock`
lockfile = true

[bootstrap.macos.dock]
autohide = true
mru_spaces = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleShowAllExtensions = true }
"com.apple.dock" = { showhidden = true }

[dotfiles]
"~/.config/raycast/skills" = "raycast/skills"
"~/.aliases" = "aliases"
"~/.ctags" = "ctags"
"~/.gemrc" = "gemrc"
"~/.gitconfig" = "gitconfig"
"~/.gitignore" = "gitignore"
"~/.gitmessage" = "gitmessage"
"~/.claude/CLAUDE.md" = "config/opencode/AGENTS.md"
"~/.codex/AGENTS.md" = "config/opencode/AGENTS.md"
"~/.ignore" = "ignore"
"~/.pgpass" = "pgpass"
"~/.prettierrc" = "prettierrc"
"~/.pryrc" = "pryrc"
"~/.psqlrc" = "psqlrc"
"~/.stylelintrc" = "stylelintrc"
"~/.zinitrc" = "zinitrc"
"~/.zshenv" = "zshenv"
"~/.zshrc" = "zshrc"
"~/.config/*" = "config/*"
"~/.config/herdr-app/keys.json/dotfiles" = { source = "config/herdr/native/keys.json", merge = true }
"~/.config/herdr-app/layouts/terminals-focus.json" = { source = "config/herdr/native/terminals-focus.json", mode = "copy" }
"~/.config/herdr-app/mods/dotfiles-copy-mode" = "config/herdr/native/copy-mode"
"~/.config/herdr-app/mods/dotfiles-nav-left/main.js" = "config/herdr/native/navigation/main.js"
"~/.config/herdr-app/mods/dotfiles-nav-left/mod.json" = "config/herdr/native/navigation/left.json"
"~/.config/herdr-app/mods/dotfiles-nav-down/main.js" = "config/herdr/native/navigation/main.js"
"~/.config/herdr-app/mods/dotfiles-nav-down/mod.json" = "config/herdr/native/navigation/down.json"
"~/.config/herdr-app/mods/dotfiles-nav-up/main.js" = "config/herdr/native/navigation/main.js"
"~/.config/herdr-app/mods/dotfiles-nav-up/mod.json" = "config/herdr/native/navigation/up.json"
"~/.config/herdr-app/mods/dotfiles-nav-right/main.js" = "config/herdr/native/navigation/main.js"
"~/.config/herdr-app/mods/dotfiles-nav-right/mod.json" = "config/herdr/native/navigation/right.json"
"~/.config/herdr-app/mods/dotfiles-resize-left/main.js" = "config/herdr/native/resize/main.js"
"~/.config/herdr-app/mods/dotfiles-resize-left/mod.json" = "config/herdr/native/resize/left.json"
"~/.config/herdr-app/mods/dotfiles-resize-down/main.js" = "config/herdr/native/resize/main.js"
"~/.config/herdr-app/mods/dotfiles-resize-down/mod.json" = "config/herdr/native/resize/down.json"
"~/.config/herdr-app/mods/dotfiles-resize-up/main.js" = "config/herdr/native/resize/main.js"
"~/.config/herdr-app/mods/dotfiles-resize-up/mod.json" = "config/herdr/native/resize/up.json"
"~/.config/herdr-app/mods/dotfiles-resize-right/main.js" = "config/herdr/native/resize/main.js"
"~/.config/herdr-app/mods/dotfiles-resize-right/mod.json" = "config/herdr/native/resize/right.json"

[tasks."tart:fresh-install"]
description = "Run a fresh-install test in an ephemeral Tart macOS VM"
file = "scripts/tart-fresh-install-test.sh"

[tasks."tart:guest:install-core"]
description = "Run a dotfiles install flow inside a Tart macOS guest"
file = "scripts/tart-guest-install-core.sh"

[tasks."linux:fresh-install"]
description = "Run fresh-install tests in disposable Linux containers"
file = "scripts/linux-fresh-install-test.sh"
