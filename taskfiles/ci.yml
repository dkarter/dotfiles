# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

silent: true

tasks:
  fmt:check:
    desc: Checks formatting
    aliases: [format:check]
    cmd: dprint check

  ghostty:validate:
    desc: Validates Ghostty config
    cmd: ghostty +validate-config

  herdr:validate:
    desc: Validates Herdr config
    cmd: herdr config check

  lua:lint:
    desc: Check for Lua diagnostic warnings and errors
    cmd: lua-language-server --check config/nvim/lua --checklevel=Warning

  nvim-handoff:test:
    desc: Test safe Neovim file handoff behavior
    cmd: agents/skills/plan-local-storage/tests/open_in_nvim_test.zsh

  shell:lint:
    cmd: |
      # The YAML integration misreads NUL flags as command names.
      # shellcheck disable=SC2215
      { rg -l -0 --type-add 'shell:*.{sh,bash}' --type shell '' .; rg -l -0 -g '!*.{*}' '^#!.*bash' .; } |
      sort -zu |
      xargs -0 shellcheck

  television:lint:
    desc: Validate Television cable channels against their schema
    cmd: RUST_LOG=error taplo lint --config .taplo.toml "config/television/cable/**/*.toml"

  spelling:lint:
    desc: Check for code spelling errors
    cmd: typos

  yaml:lint:
    desc: Runs yamllint on this repo
    cmd: yamllint --strict --config-file ./config/yamllint/config .

  run:
    deps:
      - task: lua:lint
      - task: nvim-handoff:test
      - task: ghostty:validate
      - task: herdr:validate
      - task: fmt:check
      - task: shell:lint
      - task: television:lint
      - task: yaml:lint
      - task: spelling:lint
    cmds:
      - cmd: figlet -f rectangles done! | lolcrab -g warm
        silent: true
