# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

silent: true

includes:
  opencode:
    taskfile: ./opencode.yml
    dir: ../
    internal: true

tasks:
  agent-guard:test:
    desc: Run credential guard tests
    cmd: bun test config/agent-guard

  fmt:check:
    desc: Checks formatting
    aliases: [format:check]
    cmd: dprint check

  ghostty:validate:
    desc: Validates Ghostty config
    cmd: ghostty +validate-config

  herdr:validate:
    desc: Validates Herdr config
    cmd: herdr config check

  lua:lint:
    desc: Check for Lua diagnostic warnings and errors
    cmd: |
      VIMRUNTIME="$(NVIM_LOG_FILE="${TMPDIR:-/tmp}/nvim-lua-lint.log" nvim --headless --clean --cmd 'lua io.stdout:write(vim.env.VIMRUNTIME)' --cmd qa)" \
        lua-language-server \
          --check config/nvim/lua \
          --checklevel=Warning \
          --configpath="$PWD/config/nvim/lua_ls_ci.lua" \
          --metapath="${TMPDIR:-/tmp}/lua-language-server-meta"

  shell:lint:
    cmd: |
      # The YAML integration misreads NUL flags as command names.
      # shellcheck disable=SC2215
      { rg -l -0 --type-add 'shell:*.{sh,bash}' --type shell '' .; rg -l -0 -g '!*.{*}' '^#!.*bash' .; } |
      sort -zu |
      xargs -0 shellcheck

  television:lint:
    desc: Validate Television cable channels against their schema
    cmd: RUST_LOG=error taplo lint --config .taplo.toml "config/television/cable/**/*.toml"

  spelling:lint:
    desc: Check for code spelling errors
    cmd: typos

  scripts:test:
    desc: Run script tests
    cmd: node --test scripts/*.test.ts

  yaml:lint:
    desc: Runs yamllint on this repo
    cmd: yamllint --strict --config-file ./config/yamllint/config .

  run:
    deps:
      - task: lua:lint
      - task: opencode:plugins:check
      - task: ghostty:validate
      - task: herdr:validate
      - task: fmt:check
      - task: shell:lint
      - task: scripts:test
      - task: television:lint
      - task: yaml:lint
      - task: spelling:lint
    cmds:
      - cmd: figlet -f rectangles done! | lolcrab -g warm
        silent: true
