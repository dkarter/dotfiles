# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

silent: true

includes:
  opencode:
    taskfile: ./opencode.yml
    dir: ../
    internal: true

tasks:
  agent-guard:test:
    desc: Run credential guard tests
    cmd: bun test config/agent-guard

  fmt:check:
    desc: Checks formatting
    aliases: [format:check]
    cmd: hk check --all --step dprint

  ghostty:validate:
    desc: Validates Ghostty config
    cmd: hk check --all --step ghostty

  herdr:validate:
    desc: Validates Herdr config
    cmd: hk check --all --step herdr

  lua:lint:
    desc: Check for Lua diagnostic warnings and errors
    cmd: hk check --all --step lua

  shell:lint:
    cmd: hk check --all --step shellcheck

  toml:lint:
    desc: Validate all tracked TOML files and their associated schemas
    cmd: hk check --all --step taplo

  television:lint:
    desc: Validate Television cable channels against their schema
    cmd: hk check --all --step taplo

  spelling:lint:
    desc: Check for code spelling errors
    cmd: hk check --all --step typos

  scripts:test:
    desc: Run script tests
    cmd: hk check --all --step script-tests

  yaml:lint:
    desc: Runs yamllint on this repo
    cmd: hk check --all --step yamllint

  run:
    cmds:
      - cmd: hk check --all --no-fail-fast
      - cmd: figlet -f rectangles done! | lolcrab -g warm
        silent: true
