# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
version: 3

silent: true

tasks:
  generate:
    aliases: [gen]
    desc: Generates completions for some CLI tools
    summary: |
      Generates completions for some CLI tools
    silent: true
    vars:
      COMPLETIONS:
        - 'argocd|argocd completion zsh'
        - 'ast-grep|ast-grep completions zsh'
        - 'aube|aube completion zsh'
        - 'bat|bat --completion=zsh'
        - 'bun|bun --print "await (await fetch(\"https://raw.githubusercontent.com/oven-sh/bun/refs/heads/main/completions/bun.zsh\")).text()"'
        - 'colima|colima completion zsh'
        - 'delta|delta --generate-completion zsh'
        - 'dexter|dexter completion zsh'
        - 'dprint|dprint completions zsh'
        - 'erd|erd --completions zsh'
        - 'fj|fj completion zsh'
        - 'fnox|fnox completion zsh'
        - 'fx|fx --comp zsh'
        - 'gh|gh completion -s zsh'
        - 'ghtkn|ghtkn completion zsh'
        - 'gitleaks|gitleaks completion zsh'
        - 'gt|gt completion' # Graphite CLI
        - 'helm|helm completion zsh'
        - 'herdr|herdr completion zsh'
        - 'hwt|hwt completion zsh'
        - 'kubectl|kubectl completion zsh'
        - 'lefthook|lefthook completion zsh'
        - 'linear|linear completions zsh'
        - 'lnr|lnr completion zsh'
        - 'mise|mise completion zsh'
        - 'mix|cat "{{.ROOT_DIR}}/scripts/mix-dynamic-completion.zsh"'
        - 'op|op completion zsh'
        - 'opencode|opencode completion'
        - 'openspec|openspec completion generate zsh'
        - 'pdf-redact|pdf-redact completion zsh'
        - 'pitchfork|pitchfork completion zsh'
        - 'rg|rg --generate=complete-zsh'
        - 'sesh|sesh completion zsh'
        - 'stack|stack --completions zsh'
        - 'starship|starship completions zsh'
        - 'task|task --completion zsh'
        - 'usage|usage --completions zsh'
        - 'uv|uv generate-shell-completion zsh'
        - 'varlock|varlock complete zsh'
        - 'workmux|workmux completions zsh'
      CACHE_PATH:
        sh: echo "$HOME/.cache/zsh/completions"

    cmds:
      - cmd: mkdir -p '{{.CACHE_PATH}}'
      - for:
          var: COMPLETIONS
          as: COMP
        cmd: |
          app='{{splitList "|" .COMP | first}}'
          cmd='{{splitList "|" .COMP | last}}'
          comp_path="{{.CACHE_PATH}}/_$app"
          echo -n "Generating completions for $app..."
          if app="$app" mise exec -- bash -lc '
            executable=$(command -v "$app") || exit 1
            [[ $executable != "$HOME/.local/share/mise/shims/"* ]] || mise which "$app" >/dev/null
          ' >/dev/null 2>&1; then
            app="$app" cmd="$cmd" comp_path="$comp_path" mise exec -- bash -lc 'eval "$cmd" > "$comp_path"'
            echo "DONE"
          else
            echo "SKIPPED (executable not found)"
          fi
      - task: cache:reload

  cache:reload:
    desc: Reloads completion cache
    cmd: |
      echo -n Reloading completions cache...
      zcompdump="${XDG_CACHE_HOME:-$HOME/.cache}/zsh/zcompdump"
      rm -f "${zcompdump}"*
      ZCOMPDUMP="$zcompdump" zsh -c '
        fpath=(
          "$HOME/.cache/zsh/completions"
          "${XDG_DATA_HOME:-$HOME/.local/share}/zinit/completions"
          "${XDG_DATA_HOME:-$HOME/.local/share}/zinit/plugins/zsh-users---zsh-completions/src"
          /usr/local/share/zsh/site-functions
          /opt/homebrew/share/zsh/site-functions
          $fpath
        )
        autoload -Uz compinit
        compinit -d "$ZCOMPDUMP"
      '
      echo "DONE"
    silent: true

  cache:clear:
    desc: Clears mix completion candidates cache
    cmd: |
      echo -n Clearing mix completion cache...
      rm -f ~/.cache/zsh/mix-candidates-cache.json
      echo "DONE"
    silent: true

  sync:
    desc: Generates and updates completions
    cmds:
      - task: generate
