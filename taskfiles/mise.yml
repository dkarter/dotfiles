# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

silent: true

tasks:
  commit:
    desc: Commits mise lockfiles if changed
    silent: true
    cmd: |
      set -- \
        './mise.lock' \
        './config/mise/mise.lock' \
        './config/mise/mise.extra.lock' \
        './config/mise/mise.pdq.lock'

      if [[ -z "$(git status --porcelain -- "$@")" ]]; then
        echo "No changes in mise lockfiles"
        exit 0
      fi

      git add -- "$@"
      git commit -m 'chore(mise): update lockfiles'

  install:
    desc: Installs mise itself
    silent: true
    cmd: curl https://mise.run | MISE_INSTALL_SKIP_IF_EXISTS=1 sh

  lock:
    desc: Updates all mise lockfiles (globally and locally)
    silent: true
    cmds:
      - cmd: mise lock
      - cmd: MISE_ENV= mise lock -g
      - cmd: MISE_ENV=extra mise lock -g
      - cmd: MISE_ENV=pdq mise lock -g

  sync:
    desc: Updates mise tools (runtimes), mise itself and installs packages for this project
    cmds:
      - task: migrate:standalone
      - task: self:update
      - task: tools:install
      - task: tools:update
      - task: commit

  migrate:standalone:
    internal: true
    platforms: [darwin, linux]
    cmd: |
      set -e
      set -o pipefail

      if [[ "$(command -v mise || true)" != "$HOME/.local/bin/mise" ]]; then
        echo 'Migrating mise to the standalone mise.run installation...'
        curl https://mise.run | sh
      fi

      test -x "$HOME/.local/bin/mise"

      if command -v brew >/dev/null && brew list --formula mise &>/dev/null; then
        brew uninstall mise
      fi

  self:update:
    desc: Updates mise itself
    cmd: ~/.local/bin/mise self-update --yes --no-plugins

  tools:install:
    desc: Installs/updates all mise based tools
    cmds:
      - cmd: |
          mise trust --yes --silent
          # locked is here because despite `mise-version.jdx.dev` largely
          # eliminating the need for a github token for checking attestations,
          # we still need it for resolving `latest` for github backend tools
          mise install --locked

  tools:install:devcontainer:
    desc: Installs mise tools for prebuilt devcontainer images
    cmds:
      - cmd: |
          mise trust --yes --silent

          if [[ -d /mise/installs ]]; then
            echo 'Using preinstalled mise tools from /mise.'
            exit 0
          fi

          case "$(uname -m)" in
            aarch64|arm64)
              export MISE_DISABLE_TOOLS='resvg,github:mazznoer/lolcrab'
              ;;
          esac
          mise install --yes --cd "$HOME"
          mise install --yes

  tools:profiles:prompt:
    desc: Prompt to enable optional mise tool profiles
    silent: true
    cmds:
      - cmd: |
          if [[ ! -t 0 ]] || [[ ! -t 1 ]]; then
            task mise:tools:install
            exit 0
          fi

          if ! mise which gum &>/dev/null; then
            mise install gum
          fi

          zshrc_local="$HOME/.zshrc.local"
          mise_env=""
          existing_mise_env=""
          preselected_profiles=""

          if [[ -f "$zshrc_local" ]]; then
            existing_mise_env="$(sed -nE 's/^[[:space:]]*export[[:space:]]+MISE_ENV=([^[:space:]]+)[[:space:]]*$/\1/p' "$zshrc_local" | tail -n 1)"
          fi

          append_profile() {
            if [[ -n "$mise_env" ]]; then
              mise_env="$mise_env,$1"
            else
              mise_env="$1"
            fi
          }

          append_preselected_profile() {
            if [[ -n "$preselected_profiles" ]]; then
              preselected_profiles="$preselected_profiles,$1"
            else
              preselected_profiles="$1"
            fi
          }

          old_ifs="$IFS"
          IFS=','
          for profile in $existing_mise_env; do
            case "$profile" in
              "") ;;
              extra|pdq) append_preselected_profile "$profile" ;;
              *) append_profile "$profile" ;;
            esac
          done
          IFS="$old_ifs"

          selected_profiles="$(mise exec -- gum choose \
            --no-limit \
            --selected "$preselected_profiles" \
            --output-delimiter=, \
            --header "Select optional mise tool profiles" \
            extra pdq)"

          IFS=','
          for profile in $selected_profiles; do
            [[ -n "$profile" ]] && append_profile "$profile"
          done
          IFS="$old_ifs"

          if [[ -n "$mise_env" ]]; then
            touch "$zshrc_local"
            if grep -qE '^[[:space:]]*export[[:space:]]+MISE_ENV=' "$zshrc_local"; then
              sed -i.bak -E "s|^[[:space:]]*export[[:space:]]+MISE_ENV=.*$|export MISE_ENV=$mise_env|" "$zshrc_local"
            else
              printf '\nexport MISE_ENV=%s\n' "$mise_env" >> "$zshrc_local"
            fi
            rm -f "$zshrc_local.bak"
            echo "Enabled mise profiles via MISE_ENV=$mise_env in $zshrc_local"
          else
            if [[ -f "$zshrc_local" ]]; then
              sed -i.bak -E '/^[[:space:]]*export[[:space:]]+MISE_ENV=/d' "$zshrc_local"
              rm -f "$zshrc_local.bak"
            fi
            echo "Keeping base mise toolset only."
          fi

          MISE_ENV="$mise_env" task mise:tools:install

  tools:update:
    desc: Updates all mise based tools
    cmds:
      - cmd: mise up
        silent: true

  tools:outdated:
    desc: List all outdated tools, including major bumps
    cmds:
      - cmd: mise outdated -l
        silent: true
