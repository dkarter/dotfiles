# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

silent: true

vars:
  GH_PLUGINS:
    - 'dlvhdr/gh-dash'
    - 'meiji163/gh-notify'

tasks:
  ghtkn:git:configure:
    desc: Opt this machine in to ghtkn for Git and gh
    summary: |
      Creates the dkarter/write app config when missing and adds a tool-owned
      Git config include to ~/.gitconfig.local. It provides GitHub HTTPS
      credentials and enables the short-lived-token gh wrapper. Existing ghtkn
      app configuration is preserved. This is intentionally not part of install
      or sync because ghtkn may not be appropriate on every machine.
    cmd: mise exec -- bash ./scripts/configure-ghtkn-git-credential.sh

  ghtkn:git:remove:
    desc: Remove this machine's ghtkn Git and gh opt-in
    cmd: bash ./scripts/configure-ghtkn-git-credential.sh --remove

  automerge:renovate:
    desc: Auto merges all PRs
    summary: |
      Auto merges all PRs

      Does the following:
      - sets PRs to auto merge
      - uses squash to merge
      - automatically delete the branch after merge
    silent: true
    cmd: |
      gh pr list --state open --author 'app/renovate' | awk '{ print $1 }' | xargs -I{} gh pr merge {} --auto --squash --delete-branch

  plugins:install:
    desc: Install Github CLI plugins
    cmds:
      - for:
          var: GH_PLUGINS
          as: PLUGIN
        cmd: |
          if ! mise exec -- bash -lc 'command -v gh' >/dev/null 2>&1; then
            echo 'Skipping {{.PLUGIN}} (gh executable not found).'
            exit 0
          fi

          mise exec -- gh extension install '{{.PLUGIN}}'
        silent: true

  plugins:update:
    desc: Update Github CLI plugins
    cmds:
      - for:
          var: GH_PLUGINS
          as: PLUGIN
        cmd: |
          if ! mise exec -- bash -lc 'command -v gh' >/dev/null 2>&1; then
            echo 'Skipping {{.PLUGIN}} (gh executable not found).'
            exit 0
          fi

          mise exec -- gh extension upgrade '{{.PLUGIN}}'
        silent: true

  release:
    desc: Merges the release PR
    summary: |
      Merges the release PR which:
      - bumps the version
      - updates the changelog
      - creates a github release
    silent: true
    cmd: |
      PR_NUMBER=$(gh pr list --state open --label "autorelease: pending" --author "@me" --json number --jq '.[0].number')
      if [ -n "$PR_NUMBER" ]; then
        echo "Merging release PR #$PR_NUMBER"
        gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
      else
        echo "No release PR found"
        exit 1
      fi

  sync:
    desc: Synchronize gh plugins
    cmds:
      - task: plugins:install
      - task: plugins:update
