# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

vars:
  FONT_SOURCE_DIR: '{{.ROOT_DIR}}/assets/fonts/AgentMonoNerdFont'
  FONTS:
    - 'AgentMonoNerdFont-Regular.ttf'
    - 'AgentMonoNerdFont-Italic.ttf'
    - 'AgentMonoNerdFont-Bold.ttf'
    - 'AgentMonoNerdFont-BoldItalic.ttf'

tasks:
  sync:
    desc: Installs/updates the custom Nerd Font
    platforms: [linux, darwin]
    vars:
      FONT_DIR:
        sh: |
          if [ "$(uname)" = "Darwin" ]; then
            echo "$HOME/Library/Fonts"
          elif [ "$(uname)" = "Linux" ]; then
            mkdir -p "$HOME/.local/share/fonts"
            echo "$HOME/.local/share/fonts"
          else
            echo "Can't install fonts. Unsupported OS." >&2
            exit 1
          fi
    cmds:
      - |
        # WSL cannot install fonts into the Windows host.
        [[ "$(uname -r)" == *microsoft* ]] && exit 0

        changed=0
        for filename in {{range .FONTS}}{{.}} {{end}}; do
          source={{shellQuote .FONT_SOURCE_DIR}}/$filename
          destination={{shellQuote .FONT_DIR}}/$filename
          if [[ ! -f "$destination" ]] || ! cmp -s "$source" "$destination"; then
            echo "Installing $filename..."
            install -m 0644 "$source" "$destination"
            changed=1
          fi
        done

        if (( changed )) && [[ "$(uname)" = "Linux" ]] && command -v fc-cache >/dev/null; then
          fc-cache -f {{shellQuote .FONT_DIR}}
        fi
    silent: true

  update:
    desc: Refreshes the committed custom Nerd Font (at most once every 30 days)
    cmds:
      - uv run {{shellQuote .ROOT_DIR}}/scripts/update-agent-font.py

  update:force:
    desc: Refreshes the committed custom Nerd Font regardless of its age
    cmds:
      - uv run {{shellQuote .ROOT_DIR}}/scripts/update-agent-font.py --force
