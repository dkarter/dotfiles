#:schema https://mise.jdx.dev/schema/mise.json

[tools]
"github:crate-ci/committed" = "latest"
dprint = "latest"
fnox = "latest"
betterleaks = "1.9.0"
hk = "latest"
pitchfork = "latest"

[hooks]
postinstall = "hk install --mise"

[tasks.fmt]
description = "Formats all supported files"
run = "dprint fmt"

[tasks.fmt-check]
description = "Checks formatting and fails on differences"
run = "dprint check"
