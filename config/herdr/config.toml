onboarding = false

[theme]
name = "tokyo-night"

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"

[ui]
window_title = "{workspace}"
show_agent_labels_on_pane_borders = true
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "$pr"], ["agent", "state_text", "$context"]]

[experimental]
pane_history = true

[keys]
prefix = "ctrl+z"

close_workspace = "prefix+shift+x"
detach = "prefix+d"
focus_agent = "prefix+alt+1..9"
focus_pane_down = ""
focus_pane_left = ""
focus_pane_right = ""
focus_pane_up = ""
goto = "prefix+shift+w"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
next_workspace = "ctrl+]"
previous_workspace = "ctrl+["
reload_config = "prefix+shift+r"
rename_pane = "prefix+<"
rename_tab = "prefix+,"
rename_workspace = "prefix+r"
split_horizontal = "prefix+minus"
split_vertical = "prefix+\\"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "dotfiles.command-palette.open-workspace-picker"
description = "jump to workspace"

[[keys.command]]
key = "prefix+shift+j"
type = "plugin_action"
command = "dotfiles.command-palette.open-agent-picker"
description = "jump to agent"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "dotfiles.command-palette.open"
description = "command palette"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "dotfiles.last-workspace.toggle"
description = "toggle last workspace"

[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "herdr-open-dev-dir"
description = "open dev directory"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "herdr-popup-insert-file-path"
description = "insert file path at cursor"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+i"
type = "popup"
command = "herdr-popup-pane-read"
description = "insert pane read command"
width = "85%"
height = "75%"

[[keys.command]]
key = "prefix+shift+["
type = "shell"
command = "herdr pane swap --current --direction left"
description = "swap pane left"

[[keys.command]]
key = "prefix+shift+]"
type = "shell"
command = "herdr pane swap --current --direction right"
description = "swap pane right"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "dotfiles.seamless-navigation.navigate-left"
description = "navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "dotfiles.seamless-navigation.navigate-down"
description = "navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "dotfiles.seamless-navigation.navigate-up"
description = "navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "dotfiles.seamless-navigation.navigate-right"
description = "navigate right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "dotfiles.seamless-navigation.resize-left"
description = "resize left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "dotfiles.seamless-navigation.resize-down"
description = "resize down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "dotfiles.seamless-navigation.resize-up"
description = "resize up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "dotfiles.seamless-navigation.resize-right"
description = "resize right"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "herdr-open-pr-or-repo"
description = "open PR or repo in browser"

[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-$PWD}\" && vlm hwt-urls --select-1"
description = "open worktree URL"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "vlm herdr-visible-urls"
description = "open visible URL"
width = "85%"
height = "65%"

[[keys.command]]
key = "prefix+shift+e"
type = "popup"
command = "vlm herdr-visible-files"
description = "open visible file in Neovim"
width = "85%"
height = "65%"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "hwt.worktrees.new"
description = "new configured worktree"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "hwt.worktrees.remove"
description = "remove configured worktree"
