# yaml-language-server: $schema=https://raw.githubusercontent.com/dkarter/hwt/main/schema/herdr-worktree.schema.json
worktree_naming: full

agent: opencode

files:
  copy: []

# Synchronous: ask before HWT closes the workspace and removes ticket metadata.
# Project pre_remove lists must include <global> to retain this hook.
pre_remove:
  - sh "$HOME/.config/hwt/close-ticket.sh"

ticket_commands:
  default:
    command: [lnr, quick, '{input}', --json]
    output:
      branch: branchName
      metadata:
        identifier: issueId
        title: title
        url: url
  search:
    command: [lnr, issue, search, '{input}', --json]
    output:
      branch: branchName
      metadata:
        identifier: issueId
        title: title
        url: url
