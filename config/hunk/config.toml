theme = "tokyo-night"
mode = "auto"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = false
copy_decorations = false
cursor_line = "row"

[keybindings]
"hunk.review.scrollCodeLeft" = ["left", "shift+left", "h"]
"hunk.review.scrollCodeRight" = ["right", "shift+right", "l"]
"horizontal-scroll.jumpToStart" = "0"
