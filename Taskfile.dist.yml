# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

silent: true

includes:
  1password:
    aliases: [op]
    taskfile: ./taskfiles/1password.yaml

  arch:
    taskfile: ./taskfiles/arch.yml

  bat:
    taskfile: ./taskfiles/bat.yml

  brew:
    aliases: [b]
    taskfile: ./taskfiles/brew.yml

  ci:
    taskfile: ./taskfiles/ci.yml

  comp:
    aliases: [c, completions]
    taskfile: ./taskfiles/completions.yml

  debian:
    taskfile: ./taskfiles/debian.yml

  dc:
    aliases: [devcontainer]
    taskfile: ./taskfiles/devcontainer.yml

  dot:
    aliases: [dots]
    taskfile: ./taskfiles/dotfiles.yml

  fonts:
    taskfile: ./taskfiles/fonts.yml

  gh:
    aliases: [github]
    taskfile: ./taskfiles/github.yml

  ghtkn:
    taskfile: ./taskfiles/ghtkn.yml

  herdr:
    taskfile: ./taskfiles/herdr.yml

  mac:
    taskfile: ./taskfiles/mac.yml

  mise:
    taskfile: ./taskfiles/mise.yml

  nvim:
    taskfile: ./taskfiles/nvim.yml

  pitchfork:
    taskfile: ./taskfiles/pitchfork.yml

  shell:
    aliases: [sh]
    taskfile: ./taskfiles/shell.yml

  tmux:
    aliases: [t]
    taskfile: ./taskfiles/tmux.yml

  yazi:
    aliases: [y]
    taskfile: ./taskfiles/yazi.yml

  zinit:
    taskfile: ./taskfiles/zinit.yml

tasks:
  default:
    cmd: task -l
    silent: true

  install:
    desc: An alias to dot:install
    cmds:
      - task: banner
      - task: dot:install

  sync:
    desc: An alias to dot:sync
    cmds:
      - task: banner
      - task: dot:sync

  install:sudo-touch-id:
    desc: Sets up Touch ID and Apple Watch as sufficient sudo permissions
    summary: Sets up Touch ID and Apple Watch as sufficient sudo permissions

      This survives OS updates after macOS Sonoma.

      Requires sudo.
    platforms: [darwin]
    cmds:
      - sudo-touchid --with-reattach
      - sudo install -d -o root -g wheel -m 755 /usr/local/lib/pam
      - sudo install -o root -g wheel -m 444 "$(brew --prefix pam-watchid)/lib/pam/pam_watchid.so" /usr/local/lib/pam/pam_watchid.so
      - |
        watch_id_pattern='^[[:space:]]*auth[[:space:]][[:space:]]*sufficient[[:space:]][[:space:]]*/usr/local/lib/pam/pam_watchid\.so'
        touch_id_pattern='^[[:space:]]*auth[[:space:]][[:space:]]*sufficient[[:space:]][[:space:]]*pam_tid\.so'

        if ! grep -Eq "$watch_id_pattern" /etc/pam.d/sudo_local; then
          if ! grep -Eq "$touch_id_pattern" /etc/pam.d/sudo_local; then
            echo 'Unable to find the active pam_tid.so rule in /etc/pam.d/sudo_local' >&2
            exit 1
          fi

          sudo sed -i '' '/^[[:space:]]*auth[[:space:]][[:space:]]*sufficient[[:space:]][[:space:]]*pam_tid\.so/a\
        auth       sufficient     /usr/local/lib/pam/pam_watchid.so
        ' /etc/pam.d/sudo_local
        fi

        grep -Eq "$watch_id_pattern" /etc/pam.d/sudo_local

  fmt:
    desc: Formats all formattable files
    summary: An alias to dot:fmt
    aliases: [format]
    cmds:
      - task: dot:fmt

  fmt:check:precommit:
    desc: Formats all formattable files
    summary: An alias to dot:fmt:check:precommit
    aliases: [format:check:precommit]
    cmds:
      - task: dot:fmt:check:precommit

  banner:
    internal: true
    desc: shows an animated banner
    silent: true
    if: '[ -t 1 ]'
    cmds:
      - cmd: clear
      - cmd: ./scripts/banner.sh
      # new line
      - cmd: echo ''
