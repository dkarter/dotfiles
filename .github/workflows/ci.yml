# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [master]

  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # this step was added to avoid cache write conflicts between steps
  mise:
    name: 'Mise Install + Cache'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Install Runtimes w/ MISE (and cache)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

  yaml-lint:
    name: 'Lint: Yaml'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: mise
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Runtimes w/ MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run yamllint
        run: task ci:yaml:lint

  audit-deps:
    name: 'Audit: Deps'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: mise
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Runtimes w/ MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run aube audit
        run: aube audit

  formatting:
    name: 'Check Formatting'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: mise
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Runtimes w/ MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Format check
        run: task ci:format:check

  lua-diagnostics:
    name: 'Diagnostics: Lua'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: mise
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Runtimes w/ MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          reshim: true

      - name: Run Diagnostics Check
        run: task ci:lua:lint

  shell-lint:
    name: 'Lint: Shell'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: mise
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Runtimes w/ MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run Diagnostics Check
        run: task ci:shell:lint

  spelling:
    name: 'Lint: Spelling'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: mise
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Runtimes w/ MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run Diagnostics Check
        run: task ci:spelling:lint
