name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate release app token
        id: release_app_token
        # GitHub verifies this release tag as immutable.
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Release Please
        id: release
        # googleapis/release-please-action v5.0.0
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ steps.release_app_token.outputs.token }}
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  enrich-release:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/enrich-release.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets: inherit
