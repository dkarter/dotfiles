# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Credential Guard

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/agent-guard.yml'
      - 'config/agent-guard/**'
      - 'config/amp/plugins/credential-guard.ts'
      - 'config/pi/agent/extensions/credential-guard.ts'
      - 'config/opencode/plugins/credential-guard.ts'
      - 'config/opencode/plugins/package.json'
      - 'aube-lock.yaml'
      - 'aube-workspace.yaml'
      - 'package.json'
      - 'Taskfile.dist.yml'
      - 'mise.toml'
      - 'mise.lock'
      - 'taskfiles/ci.yml'

  pull_request:
    paths:
      - '.github/workflows/agent-guard.yml'
      - 'config/agent-guard/**'
      - 'config/amp/plugins/credential-guard.ts'
      - 'config/pi/agent/extensions/credential-guard.ts'
      - 'config/opencode/plugins/credential-guard.ts'
      - 'config/opencode/plugins/package.json'
      - 'aube-lock.yaml'
      - 'aube-workspace.yaml'
      - 'package.json'
      - 'Taskfile.dist.yml'
      - 'mise.toml'
      - 'mise.lock'
      - 'taskfiles/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Test: Credential Guard'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools with Mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: bun task aube betterleaks node

      - name: Install plugin dependencies
        run: aube install --frozen-lockfile --filter ./config/opencode/plugins

      - name: Run credential guard tests
        run: task ci:agent-guard:test
