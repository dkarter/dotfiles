# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Enrich Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to enrich
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to enrich
        required: true
        type: string

concurrency:
  group: enrich-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.pullfrog.outputs.result }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout release history
        # actions/checkout does not publish immutable releases.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag }}

      - name: Resolve release range
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          mapfile -t release_tags < <(
            gh release list \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 2 \
              --json tagName \
              --jq '.[].tagName'
          )
          if [[ ${release_tags[0]:-} != "$RELEASE_TAG" ]]; then
            echo "$RELEASE_TAG is not the latest stable release" >&2
            exit 1
          fi

          previous_tag=${release_tags[1]:-}
          if [[ -z "$previous_tag" ]]; then
            echo "No previous stable release found" >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin \
            "refs/tags/$previous_tag:refs/tags/$previous_tag"

          gh release view "$RELEASE_TAG" --json body --jq '.body' \
            > .pullfrog-release-notes.md
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Summarize release
        id: pullfrog
        # pullfrog/pullfrog v0.1.60
        uses: pullfrog/pullfrog@c4d0ca6f15d12382ddd20d2010bc596b405f42f0
        with:
          push: disabled
          shell: disabled
          progress_comments: disabled
          output_schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["summary"],
              "properties": {
                "summary": {
                  "type": "string",
                  "minLength": 1
                }
              }
            }
          prompt: |
            Compare `${{ steps.release.outputs.previous_tag }}` with
            `${{ steps.release.outputs.tag }}` and write a concise Markdown
            summary for people who use this dotfiles repository. Read the
            existing generated notes in `.pullfrog-release-notes.md`, but
            verify every claim against the git diff. Include a short overview,
            notable changes, and migration or breaking-change notes when
            applicable. Omit empty sections and do not modify the repository or
            GitHub. Return the result using the required output schema.
  publish:
    needs: summarize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate release app token
        id: release_app_token
        # GitHub verifies this release tag as immutable.
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout default branch
        # actions/checkout does not publish immutable releases.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      - name: Install runtimes
        # GitHub verifies this release tag as immutable.
        uses: jdx/mise-action@v4.2.5

      - name: Prepare enriched notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.summarize.outputs.tag }}
          SUMMARY_JSON: ${{ needs.summarize.outputs.result }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq '.body' \
            > "$RUNNER_TEMP/release-notes.md"
          printf '%s' "$SUMMARY_JSON" > "$RUNNER_TEMP/summary.json"
          mise exec -- nub scripts/enrich-release-notes.ts \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/summary.json" \
            "$RUNNER_TEMP/release-notes.md" \
            CHANGELOG.md \
            "$RUNNER_TEMP/enriched-release-notes.md"

      - name: Update GitHub release
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_TAG: ${{ needs.summarize.outputs.tag }}
        run: >-
          gh release edit "$RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/enriched-release-notes.md"

      - name: Open changelog pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_TAG: ${{ needs.summarize.outputs.tag }}
        run: |
          version=${RELEASE_TAG#v}
          branch="automation/enrich-changelog-$RELEASE_TAG"

          if git diff --quiet -- CHANGELOG.md; then
            echo 'Changelog summary is already current.'
            exit 0
          fi

          base_sha=$(git rev-parse HEAD)
          base_tree=$(git rev-parse 'HEAD^{tree}')
          ref_endpoint="repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          ref_error="$RUNNER_TEMP/enrichment-ref-error"
          if branch_sha=$(gh api "$ref_endpoint" --jq '.object.sha' \
            2>"$ref_error"); then
            parents=$(jq -nc --arg branch "$branch_sha" --arg base "$base_sha" \
              'if $branch == $base then [$base] else [$branch, $base] end')
          elif grep -q 'HTTP 404' "$ref_error"; then
            branch_sha=''
            parents=$(jq -nc --arg base "$base_sha" '[$base]')
          else
            sed 's/^/Failed to read enrichment branch: /' "$ref_error" >&2
            exit 1
          fi

          blob_sha=$(jq -n --rawfile content CHANGELOG.md \
            '{content: $content, encoding: "utf-8"}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" \
              --input - --jq '.sha')
          tree_sha=$(jq -n --arg base "$base_tree" --arg blob "$blob_sha" \
            '{base_tree: $base, tree: [{path: "CHANGELOG.md", mode: "100644", type: "blob", sha: $blob}]}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" \
              --input - --jq '.sha')
          response=$(jq -n --arg message \
            "docs(changelog): enrich $version release notes" \
            --arg tree "$tree_sha" --argjson parents "$parents" \
            '{message: $message, tree: $tree, parents: $parents}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" \
              --input -)
          commit_sha=$(jq -r '.sha' <<<"$response")
          if [[ $(jq -r '.verification.verified' <<<"$response") != true ]]; then
            reason=$(jq -r '.verification.reason' <<<"$response")
            echo "GitHub did not sign the enrichment commit: $reason" >&2
            exit 1
          fi

          if [[ -n "$branch_sha" ]]; then
            gh api --method PATCH "$ref_endpoint" \
              -f sha="$commit_sha" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$commit_sha" >/dev/null
          fi

          if ! gh pr list --head "$branch" --state open --json number \
            --jq '.[0].number' | grep -q .; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "docs(changelog): enrich $version release notes" \
              --body "Adds the human-readable summary published for $RELEASE_TAG."
          fi
